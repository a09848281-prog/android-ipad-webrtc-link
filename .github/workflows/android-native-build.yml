name: Android Native Debug Build

on:
  push:
    branches:
      - android-native-stable-v1
      - feature/full-webrtc-controls-v2
    paths:
      - "android-native/**"
      - "app.js"
      - "index.html"
      - "style.css"
      - "gas/**"
      - ".github/workflows/android-native-build.yml"
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:

concurrency:
  group: webrtc-link-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check PWA JavaScript syntax
        run: node --check app.js
      - name: Check GAS JavaScript syntax
        run: node --check < gas/Code.gs
      - name: Validate Android manifest XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('android-native/app/src/main/AndroidManifest.xml')"
      - name: Assemble debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-link-android-debug
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
